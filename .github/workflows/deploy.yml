name: Deploy ReScript Frontend

on:
  push:
    branches:
      - main
  # Disabled while SofaScore blocks direct API refreshes with 403.
  # schedule:
  #   # GitHub schedules are UTC; this runs every Tuesday at 06:00 UTC.
  #   - cron: '0 6 * * 2'
  workflow_dispatch:
    inputs:
      refresh_database:
        description: 'Refresh SofaScore data before deploying'
        required: true
        type: boolean
        default: false
      season:
        description: 'Optional season start year to refresh, for example 2025'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Python Tests
        run: pytest

      # Data refresh is paused while SofaScore blocks direct API access (403).
      # To re-enable, uncomment the steps below (and the schedule trigger above).
      # - name: Refresh SofaScore Database (scheduled)
      #   if: github.event_name == 'schedule'
      #   run: |
      #     python update_site.py
      #     python youtube_summary_scraper.py
      #
      # - name: Refresh SofaScore Database (manual)
      #   if: github.event_name == 'workflow_dispatch' && inputs.refresh_database
      #   env:
      #     SEASON: ${{ inputs.season }}
      #   run: |
      #     if [ -n "$SEASON" ]; then
      #       python update_site.py --season "$SEASON"
      #     else
      #       python update_site.py
      #     fi
      #     python youtube_summary_scraper.py

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify and Build Application
        working-directory: ./frontend
        run: npm run verify:deploy

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
